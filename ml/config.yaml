# One knob-file for the whole pipeline. Every stage reads this via
# pipeline.common.config.load(); nothing hard-codes a path or threshold.

paths:
  data_dir: ./data # parquet working data (gitignored)
  artifacts_dir: ./artifacts # fitted models + reference table (gitignored)
  stockfish: ./stockfish/stockfish # native SF binary for stage 03 (gitignored)

lichess:
  # Which monthly dump to ingest. Run one month, then change this and run
  # again to append a second month (players overlap -> more games each).
  month: "2024-06"
  url_template: "https://database.lichess.org/standard/lichess_db_standard_rated_{month}.pgn.zst"

ingest:
  speed: blitz # bullet | blitz | rapid | classical (Lichess's own bucketing)
  # First real run, scaled to this hardware (2 cores, no cloud VM) rather
  # than the ~500-800k production target - checkpointed, so raising this
  # and re-running later resumes and grows the set instead of restarting.
  target_games: 40000 # stop after this many KEPT games (or end of file)
  elo_min: 600
  elo_max: 3000
  min_plies: 10
  min_eval_coverage: 0.80 # fraction of plies that must carry a [%eval ...]
  checkpoint_every: 2000 # flush a parquet partition + checkpoint.json this often
  read_chunk_bytes: 1048576 # 1 MiB decompressed-text read size
  request_timeout_s: 120

move_features:
  book_min_count: 20 # a (position -> move) needs this many sightings to count as "book"
  book_max_ply: 30 # only build the book for the opening/early middlegame
  # win% drop thresholds (mover's perspective, 0-100 scale) — must match
  # features/board/lib/move-analysis.ts:classifyMove in the web app.
  classify:
    best: 2
    good: 6
    inaccuracy: 12
    mistake: 25

engine_labels:
  # No cloud VM this run - sized to actually finish on a loaded 2-core
  # laptop (a real Stockfish search here runs several seconds under load;
  # the production 80k/depth-14 pass is meant for a cloud spot VM, see
  # ml/README.md). Small and shallow, but still a real engine on real
  # positions - re-run with the production values once a VM is available.
  sample_games: 150
  plies_per_game: 4
  depth: 8
  multipv: 3
  threads_per_worker: 1
  only_move_wp_gap: 15 # top-two win% gap for `only_move`
  tactic_gain_pawns: 1.5 # forcing line must gain at least this (or mate) for `has_tactic`

player_vectors:
  # Lowered for this first, smaller-than-production run: a 40k-game slice
  # is a narrow real-time window (Lichess dump order ~= play order), so
  # even active players rarely rack up 15 games inside it. Raise back to
  # 15/8/8 once the ingest target itself is scaled up.
  min_games: 5
  min_games_with_clocks: 3
  min_games_with_evals: 3
  max_games_per_player: 100

cohort:
  k_neighbours: 600
  peer_band_glicko: 60 # +/- this = "peers"
  stronger_band_glicko: [100, 250] # this much above = "betters"

validate:
  disentanglement_r2_max: 0.15
  skill_mae_max: 120

# Hand-derived pole-to-pole descriptions for the first few PCA axes, read from
# the loadings in artifacts/style/pc_loadings.md after each style_embedding
# run. Indices not listed here fall back to "PC{i}" in 10_export_artifacts.py.
style_axis_labels:
  0: "Sharp & forcing ↔ Quiet & maneuvering"
  1: "Improvises, castles late ↔ Prepared, castles early"
  2: "Patient & well-prepared ↔ Fast & king-hunting"
  3: "Calm, pawn-structure play ↔ Volatile, forcing swings"
